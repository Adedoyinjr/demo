name: Privacy prettier fix

on:
  push:
    branches:
      - feat/privacy-posture-chip-152

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style: apply prettier'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/privacy-posture-chip-152

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - run: pnpm install --frozen-lockfile

      - name: Apply Prettier
        run: pnpm exec prettier --write src/components/PrivacyPostureChip.tsx src/pages/Privacy.tsx

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PrivacyPostureChip.tsx src/pages/Privacy.tsx
          git commit -m "style: apply prettier"
          git push origin HEAD:feat/privacy-posture-chip-152
