name: Privacy prettier diff

on:
  push:
    branches:
      - feat/privacy-posture-chip-152

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/privacy-posture-chip-152

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - run: pnpm install --frozen-lockfile

      - name: Apply Prettier locally
        run: pnpm exec prettier --write src/components/PrivacyPostureChip.tsx src/pages/Privacy.tsx

      - name: Show exact diff
        run: git diff -- src/components/PrivacyPostureChip.tsx src/pages/Privacy.tsx
